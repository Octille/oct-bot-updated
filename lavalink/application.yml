# Lavalink config used by the lavalink container in docker-comp.yml (lavalink/start.sh picks the jar).
# Secrets come from environment variables — nothing sensitive is stored here.
server:
  port: ${LAVALINK_PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
    # YouTube / YouTube Music, used behind the scenes to play songs (links to YouTube stay refused by the bot)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false # Lavalink's built-in source is on by default, so it must be switched off here
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      # Direct audio links, uploaded files and radio streams (the bot only passes public https URLs)
      http: true
      local: false

plugins:
  youtube:
    enabled: ${YOUTUBE_ENABLED:true} # false = SoundCloud only
    allowSearch: true # ytmsearch: is how the bot finds songs
    allowDirectVideoIds: false
    allowDirectPlaylistIds: false
    # Tried in order. MUSIC only searches; TV plays with the OAuth sign-in; the rest are fallbacks without it.
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      # A throwaway Google account, never a personal one (docs/DEPLOY.md, "YouTube sign-in").
      # Empty token = Lavalink prints a sign-in code in its log; after signing in it prints the token to put in .env.
      enabled: ${YOUTUBE_OAUTH:true}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
  lavasrc:
    # Spotify and Apple Music links are only read for their track info; the bot then finds the song
    # on SoundCloud itself (and says so when there's no good match). Mirroring only searches SoundCloud.
    providers:
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      # Free app keys from https://developer.spotify.com/dashboard (SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET in .env)
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      # Spotify market for search results and links (SPOTIFY_MARKET in .env, default CA)
      countryCode: "${SPOTIFY_MARKET:CA}"
      playlistLoadLimit: 1
      albumLoadLimit: 1
      resolveArtistsInSearch: false
    applemusic:
      # Leave empty: LavaSrc fetches a token from music.apple.com by itself
      mediaAPIToken: "${APPLE_MUSIC_TOKEN:}"
      countryCode: "US"
      playlistLoadLimit: 1
      albumLoadLimit: 1

logging:
  level:
    root: INFO
    lavalink: INFO
    # Shows the YouTube sign-in code and the refresh token (docs/DEPLOY.md)
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
